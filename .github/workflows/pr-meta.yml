name: PR meta

# Назначает исполнителя PR и вешает метки по его заголовку,
# сама логика живёт в aimuzov/.github.
#
# `pull_request_target` нужен для того чтобы PR от Renovate получали токен
# с правом записи, при этом ничего из самого PR не чекаутится и не запускается.
on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  pull-requests: write
  issues: write

jobs:
  meta:
    uses: aimuzov/.github/.github/workflows/pr-meta.yml@main

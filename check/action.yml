name: Site check
description: Install dependencies, then run the formatter, linters, type check, tests and build of an Astro site, and verify its reader changelog.

inputs:
  apt-packages:
    description: Space-separated Ubuntu packages the tests or the build need, e.g. ffmpeg.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version-file: package.json
        cache: npm
    # NOTE: `$PACKAGES` без кавычек намеренно, список через пробел
    # должен разбиться на отдельные аргументы.
    - if: inputs.apt-packages != ''
      shell: bash
      env:
        PACKAGES: ${{ inputs.apt-packages }}
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $PACKAGES
    - shell: bash
      run: npm ci
    - shell: bash
      run: npm run format:check
    - shell: bash
      run: npm run lint:js
    - shell: bash
      run: npm run lint:css
    - shell: bash
      run: npm run check
    - shell: bash
      run: npm test
    # Сайт собирается на сервере, но лучше, чтобы сборка упала здесь.
    - shell: bash
      run: npm run build
    # Ченжлог для читателя ведёт только сайт с полем `changelog` в package.json, остальным
    # шаг ничего не делает. Нужна сборка: ссылки пунктов сверяются со страницами в dist.
    # Скрипт берётся из этого же action, а не из node_modules сайта: там может быть старый кит.
    - shell: bash
      run: node "$GITHUB_ACTION_PATH/../bin/site-changelog.mjs" verify

name: Site deploy
description: Deploy a site on the projects server over SSH, then wait for it to answer.

inputs:
  ssh-key:
    description: Private key whose public half is in authorized_keys on the server, usually secrets.DEPLOY_SSH_KEY.
    required: true
  url:
    description: Site address to check after the deploy, e.g. https://example.com.
    required: true
  host:
    description: Projects server.
    required: false
    default: 185.219.43.208
  known-host:
    description: "known_hosts line of the server: ssh won't trust whoever answers there."
    required: false
    default: '185.219.43.208 ssh-rsa '

runs:
  using: composite
  steps:
    # The server knows what to do: the key in authorized_keys runs deploy/site.sh of
    # infra-server for the site, so we don't pass a command to ssh. While the deploy waits in the queue
    # of the server, the connection is silent: keepalives hold it and notice a dead one.
    - name: Deploy on server
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        KNOWN_HOST: ${{ inputs.known-host }}
        HOST: ${{ inputs.host }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
        chmod 600 ~/.ssh/deploy
        printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
        ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes \
          -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "root@$HOST"

    - name: Check site
      shell: bash
      env:
        URL: ${{ inputs.url }}
      run: |
        for i in 1 2 3 4 5; do
          curl -fsS -o /dev/null -w "%{http_code}\n" "$URL" && exit 0
          sleep 5
        done
        exit 1

name: Site release
description: Keep the release PR of a site up to date with release-please and tell when merging it cut a release.

# Вызывающему job нужны права на запись в contents, pull-requests и actions.

outputs:
  created:
    description: '"true" when this push cut a release.'
    value: ${{ steps.release-please.outputs.release_created }}
  tag:
    description: Tag of the release cut by this push, e.g. v1.2.0.
    value: ${{ steps.release-please.outputs.tag_name }}

runs:
  using: composite
  steps:
    - id: release-please
      uses: googleapis/release-please-action@v5.0.0
      with:
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json

    # Release PR создаёт github-actions[bot], поэтому GitHub придерживает
    # его прогоны pull_request до чьего-нибудь одобрения, а PR остаётся
    # заблокирован обязательной проверкой.
    #
    # Прогоны появляются через несколько секунд после изменения PR,
    # поэтому одобряем всё, что появится в течение минуты.
    - if: steps.release-please.outputs.pr
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ steps.release-please.outputs.pr }}
      run: |
        number=$(jq -r .number <<< "$PR")
        sha=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
        approved=0
        for _ in $(seq 12); do
          sleep 5
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$sha" \
            --jq '.workflow_runs[] | select(.conclusion == "action_required") | .id')
          for run in $runs; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run/approve" >/dev/null
            echo "approved run $run"
            approved=$((approved + 1))
          done
          if [[ $approved -gt 0 && -z $runs ]]; then break; fi
        done
        if [[ $approved -eq 0 ]]; then echo "no runs of the release PR waited for approval"; fi
